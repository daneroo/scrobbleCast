<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d4e89" />
    <meta name="description" content="Daniel's reading and listening log." />
    <link rel="icon" type="image/svg+xml" href="/scrobble-cast-icon.svg" />
    <title>Scrobble Cast</title>
    <script>
      // Palette trials (thoughts/theming.md step 2): ?theme=<name>&mode=dark.
      (function () {
        var q = new URLSearchParams(location.search), r = document.documentElement
        if (q.get('theme')) r.dataset.theme = q.get('theme')
        if (q.get('mode')) r.dataset.mode = q.get('mode')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
