<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">

  <title>Scrobble Cast</title>

  <!--
    2026: the 2014 icon redrawn in two colours, tilted 5° (2014: 10°).
    Units: the tile is 100 × 100 (u). Values from study.html:
      arcs: radii 28 and 14, stroke 8 (2014: 7), round caps (quarter circles)
      dots: radius 4.2, the arcs' colour
      halves: centres ±28 from the tile centre, the second turned 180°
      axis: −45° + 5° tilt = −40°
      tile: corner radius 5
    PANTONE 19-4052 Classic Blue #1d4e89 (mark), 16-1328 Sandstone #c78d6b (tile)
  -->

  <rect width="100" height="100" rx="5" fill="#c78d6b"/>

  <g transform="translate(50 50) rotate(-40)" fill="#1d4e89" stroke="#1d4e89" stroke-width="8" stroke-linecap="round">
    <g id="half" transform="translate(-28 0)">
      <circle r="4.2" stroke="none"/>
      <path d="M0,14 A14 14 0 0 0 14,0 M0,28 A28 28 0 0 0 28,0" fill="none"/>
    </g>
    <use href="#half" transform="rotate(180)"/>
  </g>

</svg>
